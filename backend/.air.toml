# air hot-reload 配置 — 猫眼票价监控服务 (Gin 框架)
# 启动: air
# 使用: 修改 .go 文件自动重编译+重启

root = "."
tmp_dir = "tmp"
env_files = [".env"]

[build]
  # 编译命令 (Windows / Linux 兼容)
  cmd = "go build -o ./tmp/server.exe ./cmd/server/main.go"
  bin = "tmp/server.exe"
  entrypoint = ["tmp/server.exe"]
  delay = 1000
  # 排除目录（避免循环触发）
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "tools", "migrations"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "tpl", "tmpl", "html", "env"]

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = true

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = true
  keep_scroll = true
